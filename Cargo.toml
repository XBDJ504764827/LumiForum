[workspace]
resolver = "2"
members = ["apps/api"]
default-members = ["apps/api"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/lumiforum/lumiforum"
rust-version = "1.88"

[workspace.dependencies]
# Filled in when apps/api is scaffolded (step ⑤)
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
redis = { version = "1.4", features = ["tokio-comp", "connection-manager"] }
jsonwebtoken = "11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
