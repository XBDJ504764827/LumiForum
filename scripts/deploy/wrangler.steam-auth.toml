# =============================================================================
# Steam Auth Relay — Cloudflare Worker 部署配置模板
#
# 用法（二选一）：
#   A) Cloudflare Dashboard 手动部署：
#       Workers & Pages → 选择 steam-auth 相关 Worker → 编辑代码，
#       粘贴 scripts/deploy/steam-auth-worker.js 的内容 →
#       设置 → 绑定 → KV namespace（变量名 STEAM_TOKENS）→ 部署。
#
#   B) wrangler CLI（推荐，可重复部署）：
#       1. 复制本文件为 wrangler.toml（与本 worker 代码同目录）
#       2. 创建 KV namespace 并把返回的 id 填入下方：
#            npx wrangler kv namespace create STEAM_TOKENS
#       3. 部署：
#            npx wrangler deploy
#
# 可选配置：
#   - STEAM_API_KEY（vars 或 secret）：Steam Web API Key，用于同步昵称/头像；
#     不配置时登录只返回 steamid，昵称回退为 steam_<steamid>。
#   - ALLOWED_CALLBACK_HOSTS：允许回跳的论坛回调域名白名单（逗号分隔）。
#     默认 chatapi.cngokz.com。本地调试如需回跳开发机，把
#     192.168.0.138:8187 也加进去。
# =============================================================================

name = "steam-auth-relay"
main = "steam-auth-worker.js"
compatibility_date = "2024-11-01"

# 一次性 token 存储（必须创建并绑定）
[[kv_namespaces]]
binding = "STEAM_TOKENS"
id = "在此填入 KV namespace id"

# 可选：Steam Web API Key（也可用 npx wrangler secret put STEAM_API_KEY）
# [vars]
# STEAM_API_KEY = "YOUR_STEAM_WEB_API_KEY"
# ALLOWED_CALLBACK_HOSTS = "chatapi.cngokz.com,192.168.0.138:8187"
