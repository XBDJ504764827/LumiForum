# LumiForum production stack
# Usage on server:
#   cp .env.production.example .env
#   ./scripts/deploy/up.sh
#
# Images default to GHCR; override IMAGE_API / IMAGE_WEB for private registries.

name: lumiforum-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lumiforum}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-lumiforum}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
    logging: &default_logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "7"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.prod.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - internal
    logging: *default_logging

  api:
    image: ${IMAGE_API:-ghcr.io/lumiforum/lumiforum-api:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      RUST_LOG: ${RUST_LOG:-info,tower_http=info,sqlx=warn}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lumiforum}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-lumiforum-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-lumiforum-web}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-2592000}
      PASSWORD_HASH_CONCURRENCY: ${PASSWORD_HASH_CONCURRENCY:-4}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-lumiforum_refresh}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}
      AUTHORIZATION_CACHE_TTL_SECONDS: ${AUTHORIZATION_CACHE_TTL_SECONDS:-30}
      CORS_ORIGIN: ${CORS_ORIGIN}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_LOCAL_ROOT: /data/uploads
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-lumiforum}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      WS_MAX_CONNECTIONS_PER_USER: ${WS_MAX_CONNECTIONS_PER_USER:-5}
      WS_HEARTBEAT_SECS: ${WS_HEARTBEAT_SECS:-30}
      WS_IDLE_TIMEOUT_SECS: ${WS_IDLE_TIMEOUT_SECS:-90}
      PRESENCE_TTL_SECS: ${PRESENCE_TTL_SECS:-60}
      WS_CONNECT_RATE_LIMIT: ${WS_CONNECT_RATE_LIMIT:-30}
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - internal
    logging: *default_logging

  web:
    image: ${IMAGE_WEB:-ghcr.io/lumiforum/lumiforum-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Server-side fetches inside the compose network
      API_INTERNAL_URL: http://api:8080
      # NEXT_PUBLIC_* are build-time; kept here for documentation parity only
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - internal
    logging: *default_logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
      - nginx_logs:/var/log/nginx
    # Select TLS vs bootstrap template, then start nginx (official image envsubst is bypassed).
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache wget gettext >/dev/null
        mkdir -p /etc/nginx/conf.d
        if [ ! -f "/etc/letsencrypt/live/$${DOMAIN}/fullchain.pem" ]; then
          echo "TLS cert missing — using bootstrap HTTP template"
          envsubst '$$DOMAIN' < /etc/nginx/templates/bootstrap.conf.template > /etc/nginx/conf.d/default.conf
        else
          envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf
        fi
        nginx -t
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null 2>&1 || wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - internal
      - edge
    logging: *default_logging

  certbot:
    image: certbot/certbot:v3.1.0
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    profiles: ["certs"]
    entrypoint: certbot
    networks:
      - edge

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-lumiforum}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_CRON: ${BACKUP_CRON:-0 3 * * *}
    volumes:
      - ./scripts/backup/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
      - ./scripts/backup/backup-entrypoint.sh:/usr/local/bin/backup-entrypoint.sh:ro
      - backup_data:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup-entrypoint.sh"]
    networks:
      - internal
    logging: *default_logging

  # Optional observability: docker compose -f docker-compose.prod.yml --profile monitoring up -d
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lumiforum}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal
    logging: *default_logging

  redis-exporter:
    image: oliver006/redis_exporter:v1.66.0
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    logging: *default_logging

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - postgres-exporter
      - redis-exporter
    networks:
      - internal
    logging: *default_logging

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://forum.example.com/grafana/}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    # Bind only on localhost by default; expose via SSH tunnel or extra Nginx location.
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - internal
    logging: *default_logging

networks:
  internal:
    driver: bridge
    internal: false
  edge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  backup_data:
  certbot_www:
  certbot_certs:
  nginx_logs:
  prometheus_data:
  grafana_data:
