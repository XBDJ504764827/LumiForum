name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  CARGO_TERM_COLOR: always

jobs:
  build-and-deploy:
    name: Build and deploy main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://chat.cngokz.com

    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Web source
        run: pnpm check

      - name: Validate Rust source
        run: |
          cargo fmt --all -- --check
          cargo test --workspace --all-targets --locked

      - name: Build API release binaries
        run: >-
          cargo build --release --locked -p lumiforum-api
          --bin lumiforum-api --bin migrate

      - name: Validate production configuration
        shell: bash
        env:
          PROD_API_PUBLIC_URL: ${{ vars.PROD_API_PUBLIC_URL }}
          PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}
          PROD_SITE_NAME: ${{ vars.PROD_SITE_NAME }}
          PROD_SITE_DESCRIPTION: ${{ vars.PROD_SITE_DESCRIPTION }}
          PROD_DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
          PROD_API_PORT: ${{ vars.PROD_API_PORT }}
          PROD_WEB_PORT: ${{ vars.PROD_WEB_PORT }}
          PROD_R2_ENDPOINT: ${{ vars.PROD_R2_ENDPOINT }}
          PROD_R2_BUCKET: ${{ vars.PROD_R2_BUCKET }}
        run: |
          set -Eeuo pipefail
          required_vars=(
            PROD_API_PUBLIC_URL
            PROD_SITE_URL
            PROD_SITE_NAME
            PROD_SITE_DESCRIPTION
            PROD_DEPLOY_PATH
            PROD_API_PORT
            PROD_WEB_PORT
            PROD_R2_ENDPOINT
            PROD_R2_BUCKET
          )
          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing production variable: $name" >&2
              exit 1
            fi
          done
          [[ "$PROD_API_PUBLIC_URL" == https://* ]]
          [[ "$PROD_SITE_URL" == https://* ]]
          [[ "$PROD_R2_ENDPOINT" == https://* ]]
          [[ "$PROD_R2_BUCKET" =~ ^[a-z0-9.-]+$ ]]
          [[ "$PROD_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$PROD_API_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$PROD_WEB_PORT" =~ ^[0-9]{1,5}$ ]]

      - name: Build production Web bundle
        run: pnpm build:web
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ vars.PROD_API_PUBLIC_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.PROD_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ vars.PROD_SITE_NAME }}
          NEXT_PUBLIC_SITE_DESCRIPTION: ${{ vars.PROD_SITE_DESCRIPTION }}
          # The GitHub runner cannot use the production host's loopback URL.
          # The server's runtime value still comes from web/.env.
          API_INTERNAL_URL: ${{ vars.PROD_API_PUBLIC_URL }}

      - name: Package release artifacts
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id="${DEPLOY_SHA}-$(date -u +%Y%m%d%H%M%S)"
          artifact_dir="$RUNNER_TEMP/lumiforum-$release_id"
          web_dir="$RUNNER_TEMP/lumiforum-web-$release_id"
          mkdir -p "$artifact_dir" "$web_dir/apps/web/.next"

          install -m 755 target/release/lumiforum-api "$artifact_dir/lumiforum-api"
          install -m 755 target/release/migrate "$artifact_dir/migrate"
          strip --strip-unneeded "$artifact_dir/lumiforum-api" "$artifact_dir/migrate"
          cp -a apps/web/.next/standalone/. "$web_dir/"
          cp -a apps/web/.next/static "$web_dir/apps/web/.next/static"
          cp -a apps/web/public "$web_dir/apps/web/public"
          tar -C "$web_dir" -czf "$artifact_dir/lumiforum-web.tar.gz" .
          install -m 755 scripts/deploy/activate-production-release.sh \
            "$artifact_dir/activate-production-release.sh"

          printf '%s\n' \
            "git_commit=$DEPLOY_SHA" \
            "git_ref=refs/heads/main" \
            "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "rustc=$(rustc --version)" \
            "node=$(node --version)" \
            "pnpm=$(pnpm --version)" \
            > "$artifact_dir/BUILD-INFO"

          (
            cd "$artifact_dir"
            sha256sum lumiforum-api migrate lumiforum-web.tar.gz \
              activate-production-release.sh BUILD-INFO > SHA256SUMS
          )

          # Combine the release files into one compressed object for the R2
          # relay. This also compresses the Rust binaries.
          upload_archive="$RUNNER_TEMP/lumiforum-$release_id-upload.tar.gz"
          tar -C "$artifact_dir" -czf "$upload_archive" .
          ls -lh "$upload_archive"

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "upload_archive=$upload_archive" >> "$GITHUB_OUTPUT"
        env:
          PROD_API_PUBLIC_URL: ${{ vars.PROD_API_PUBLIC_URL }}
          PROD_SITE_URL: ${{ vars.PROD_SITE_URL }}
          PROD_DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
          PROD_API_PORT: ${{ vars.PROD_API_PORT }}
          PROD_WEB_PORT: ${{ vars.PROD_WEB_PORT }}
          DEPLOY_SHA: ${{ github.sha }}

      - name: Configure deployment SSH key
        shell: bash
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${PROD_SSH_PRIVATE_KEY:?Missing PROD_SSH_PRIVATE_KEY secret}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > ~/.ssh/production
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/production ~/.ssh/known_hosts

      - name: Verify AWS CLI
        run: aws --version

      - name: Upload release to R2
        id: r2_upload
        shell: bash
        env:
          PROD_R2_ENDPOINT: ${{ vars.PROD_R2_ENDPOINT }}
          PROD_R2_BUCKET: ${{ vars.PROD_R2_BUCKET }}
          R2_DEPLOY_ACCESS_KEY: ${{ secrets.R2_DEPLOY_ACCESS_KEY }}
          R2_DEPLOY_SECRET_KEY: ${{ secrets.R2_DEPLOY_SECRET_KEY }}
          UPLOAD_ARCHIVE: ${{ steps.release.outputs.upload_archive }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          : "${PROD_R2_ENDPOINT:?Missing PROD_R2_ENDPOINT variable}"
          : "${PROD_R2_BUCKET:?Missing PROD_R2_BUCKET variable}"
          : "${R2_DEPLOY_ACCESS_KEY:?Missing R2_DEPLOY_ACCESS_KEY secret}"
          : "${R2_DEPLOY_SECRET_KEY:?Missing R2_DEPLOY_SECRET_KEY secret}"
          : "${UPLOAD_ARCHIVE:?Missing packaged upload archive}"
          test -f "$UPLOAD_ARCHIVE"
          command -v aws >/dev/null
          [[ "$PROD_R2_ENDPOINT" == https://* ]]

          export AWS_ACCESS_KEY_ID="$R2_DEPLOY_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_DEPLOY_SECRET_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_CONFIG_FILE="$RUNNER_TEMP/r2-aws-config"
          printf '%s\n' '[default]' 'region = auto' 's3 =' '    addressing_style = path' > "$AWS_CONFIG_FILE"
          r2_key="deploy/lumiforum/$RELEASE_ID/upload.tar.gz"
          # Set this before uploading so cleanup can remove a partial object too.
          echo "r2_object_key=$r2_key" >> "$GITHUB_OUTPUT"

          aws s3 cp "$UPLOAD_ARCHIVE" "s3://$PROD_R2_BUCKET/$r2_key" \
            --endpoint-url "$PROD_R2_ENDPOINT" \
            --region auto \
            --only-show-errors
          aws s3api head-object \
            --bucket "$PROD_R2_BUCKET" \
            --key "$r2_key" \
            --endpoint-url "$PROD_R2_ENDPOINT" \
            --region auto >/dev/null

      - name: Download release from R2 on production
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_R2_ENDPOINT: ${{ vars.PROD_R2_ENDPOINT }}
          PROD_R2_BUCKET: ${{ vars.PROD_R2_BUCKET }}
          R2_DEPLOY_ACCESS_KEY: ${{ secrets.R2_DEPLOY_ACCESS_KEY }}
          R2_DEPLOY_SECRET_KEY: ${{ secrets.R2_DEPLOY_SECRET_KEY }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          : "${PROD_SSH_HOST:?Missing PROD_SSH_HOST secret}"
          : "${PROD_SSH_USER:?Missing PROD_SSH_USER secret}"
          : "${PROD_R2_ENDPOINT:?Missing PROD_R2_ENDPOINT variable}"
          : "${PROD_R2_BUCKET:?Missing PROD_R2_BUCKET variable}"
          : "${R2_DEPLOY_ACCESS_KEY:?Missing R2_DEPLOY_ACCESS_KEY secret}"
          : "${R2_DEPLOY_SECRET_KEY:?Missing R2_DEPLOY_SECRET_KEY secret}"
          command -v aws >/dev/null
          export AWS_ACCESS_KEY_ID="$R2_DEPLOY_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_DEPLOY_SECRET_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_CONFIG_FILE="$RUNNER_TEMP/r2-aws-config"
          printf '%s\n' '[default]' 'region = auto' 's3 =' '    addressing_style = path' > "$AWS_CONFIG_FILE"
          r2_key="deploy/lumiforum/$RELEASE_ID/upload.tar.gz"
          download_url="$(aws s3 presign "s3://$PROD_R2_BUCKET/$r2_key" \
            --endpoint-url "$PROD_R2_ENDPOINT" \
            --region auto \
            --expires-in 3600)"
          test -n "$download_url"
          ssh_port="${PROD_SSH_PORT:-22}"
          [[ "$ssh_port" =~ ^[0-9]{1,5}$ ]]
          remote_dir="/tmp/lumiforum-$RELEASE_ID"
          remote_archive="${remote_dir}-upload.tar.gz"
          ssh_options=(
            -i ~/.ssh/production
            -p "$ssh_port"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=accept-new
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o ConnectTimeout=20
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
          )

          ssh "${ssh_options[@]}" "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "rm -rf '$remote_dir' '$remote_archive' && install -d -m 700 '$remote_dir'"

          # The production host downloads from Cloudflare instead of receiving
          # the slow GitHub-hosted-runner-to-server transfer.
          printf '%s\n' "$download_url" | \
            timeout 30m ssh "${ssh_options[@]}" "$PROD_SSH_USER@$PROD_SSH_HOST" \
              "read -r url && curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 1800 --silent --show-error \"\$url\" --output '$remote_archive' && tar -xzf '$remote_archive' -C '$remote_dir' && rm -f '$remote_archive'"

      - name: Activate production release
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
          PROD_API_PORT: ${{ vars.PROD_API_PORT }}
          PROD_WEB_PORT: ${{ vars.PROD_WEB_PORT }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          ssh_port="${PROD_SSH_PORT:-22}"
          ssh \
            -i ~/.ssh/production \
            -p "$ssh_port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "bash '/tmp/lumiforum-$RELEASE_ID/activate-production-release.sh' '$RELEASE_ID' '$PROD_DEPLOY_PATH' '$PROD_API_PORT' '$PROD_WEB_PORT'"

      - name: Remove temporary R2 release object
        if: ${{ always() && steps.r2_upload.outputs.r2_object_key != '' }}
        continue-on-error: true
        shell: bash
        env:
          PROD_R2_ENDPOINT: ${{ vars.PROD_R2_ENDPOINT }}
          PROD_R2_BUCKET: ${{ vars.PROD_R2_BUCKET }}
          R2_DEPLOY_ACCESS_KEY: ${{ secrets.R2_DEPLOY_ACCESS_KEY }}
          R2_DEPLOY_SECRET_KEY: ${{ secrets.R2_DEPLOY_SECRET_KEY }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          [[ -n "${PROD_R2_ENDPOINT:-}" && -n "${PROD_R2_BUCKET:-}" ]] || exit 0
          [[ -n "${R2_DEPLOY_ACCESS_KEY:-}" && -n "${R2_DEPLOY_SECRET_KEY:-}" ]] || exit 0
          export AWS_ACCESS_KEY_ID="$R2_DEPLOY_ACCESS_KEY"
          export AWS_SECRET_ACCESS_KEY="$R2_DEPLOY_SECRET_KEY"
          export AWS_DEFAULT_REGION=auto
          export AWS_EC2_METADATA_DISABLED=true
          export AWS_CONFIG_FILE="$RUNNER_TEMP/r2-aws-config"
          printf '%s\n' '[default]' 'region = auto' 's3 =' '    addressing_style = path' > "$AWS_CONFIG_FILE"
          r2_key="deploy/lumiforum/$RELEASE_ID/upload.tar.gz"
          aws s3api delete-object \
            --bucket "$PROD_R2_BUCKET" \
            --key "$r2_key" \
            --endpoint-url "$PROD_R2_ENDPOINT" \
            --region auto >/dev/null

      - name: Remove remote staging directory
        if: ${{ always() }}
        shell: bash
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          [[ -n "${PROD_SSH_HOST:-}" && -n "${PROD_SSH_USER:-}" ]] || exit 0
          ssh_port="${PROD_SSH_PORT:-22}"
          ssh \
            -i ~/.ssh/production \
            -p "$ssh_port" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=10 \
            "$PROD_SSH_USER@$PROD_SSH_HOST" \
            "rm -rf '/tmp/lumiforum-$RELEASE_ID' '/tmp/lumiforum-$RELEASE_ID-upload.tar.gz'" || true
