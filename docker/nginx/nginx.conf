worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 25m;

  # Gzip for text assets (Next already compresses many responses; still useful for proxied JSON)
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  # Basic connection/request rate limits
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=40r/s;
  limit_conn_zone $binary_remote_addr zone=addr:10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream lumiforum_web {
    server web:3000;
    keepalive 32;
  }

  upstream lumiforum_api {
    server api:8080;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
